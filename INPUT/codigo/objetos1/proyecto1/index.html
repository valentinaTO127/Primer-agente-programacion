<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Fuente manuscrita para el título (Google Fonts); preconnect adelanta la conexión al servidor de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Botón que alterna modo claro/oscuro, controlado desde index.js -->
    <button id="theme-toggle" class="theme-toggle"></button>

    <a class="nav-link" href="gestion.html">Gestión</a>

    <!-- Slider vertical de edad máxima, fijo a la izquierda y fuera del <form>.
         El atributo form="formulario-filtros" lo sigue asociando al formulario, así "Limpiar" también lo reinicia.
         min/max se calculan por JS a partir de "patinadores" -->
    <label class="filtro-edad">Edad máx.
        <output id="valor-edad" for="filtro-edad"></output>
        <input type="range" name="edad" id="filtro-edad" step="1" form="formulario-filtros">
    </label>

    <main class="pagina-galeria">
        <!-- Reusa .gestion-titulo (fuente y color de gestion.html) + .titulo-galeria para el tamaño -->
        <h1 class="gestion-titulo titulo-galeria">Figure Skaters</h1>

        <!-- Filtros: las opciones de país se generan por JS a partir de las nacionalidades de "patinadores" -->
        <form class="filtros" id="formulario-filtros">
            <label>País
                <select name="pais" id="filtro-pais">
                    <option value="">Todos</option>
                </select>
            </label>

            <!-- Estado como botones: son radios (solo uno activo a la vez) con estilo de botón.
                 "checked" en "Todos" es el valor al que vuelve con "Limpiar" -->
            <fieldset class="filtro-estado">
                <legend>Estado</legend>
                <label><input type="radio" name="estado" value="" checked><span>Todos</span></label>
                <label><input type="radio" name="estado" value="activo"><span>Activo</span></label>
                <label><input type="radio" name="estado" value="retirado"><span>Retirado</span></label>
            </fieldset>

            <div class="filtros-acciones">
                <button type="reset" class="sidebar-link">Limpiar</button>
            </div>
        </form>

        <p class="galeria-vacia" id="galeria-vacia" hidden>No hay patinadores con esos filtros.</p>

        <!-- Contenedor vacío: las tarjetas se generan por JS en tiempo de ejecución -->
        <section class="galeria" id="galeria"></section>
    </main>

    <script src="data.js"></script>
    <script src="index.js"></script>
</body>
</html>
