<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado 2 — Grid Básico (para completar en clase)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    body.dark-mode {
        background-color: #0f0814;
    }

    body.dark-mode h1, body.dark-mode p {
        color: #ecf0f1;
    }
    /* ==========================================
       ESTADO 2 — Grid Básico (SIN RESOLVER a propósito)
       Este es el punto de partida para escribirlo en vivo en clase.
       Sigue los TODO en orden — cada uno agrega UNA propiedad de la
       tabla "Propiedades del contenedor" del recurso de Grid/Flexbox
       (semana_03_recurso_css_grid_flexbox_tailwind.md).
    ========================================== */
    .grid-container {

      /* TODO 1: activa Grid en este contenedor.
         Propiedad: display
         Valor: grid
      */

      /* TODO 2: define 3 columnas de 200px cada una.
         Propiedad: grid-template-columns
         Pista: puedes escribir "200px 200px 200px" a mano,
         o usar el atajo repeat(3, 200px) — ambos hacen lo mismo.
      */

      /* TODO 3: agrega espacio entre las celdas, sin usar márgenes.
         Propiedad: gap
         Valor sugerido: 15px
      */

      /* Ya viene incluido, no lo toques: */
      background-color: #ecf0f1;
      display: grid;
      grid-template-columns: 100px 2fr 1fr;
      gap: 15px;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .grid-item, .grid-item2, .grid-item3 {
      background-color: #3498db;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    .grid-item2 {
      background-color: #3453db;
    }

    .grid-item3 {
      background-color: #34db6a;
    }

    #caja-2 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    #caja-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    button {
      background-color: #3498db;
      color: #ecf0f1;
      padding: 8px;
      border-radius: 20px;
      border: none;
    }

    @media (min-width: 500px) {
        .grid-item, button {
        background-color: #340055;
        }
    
      .grid-container {
          background-color: #53ab86;
      }
    }

    @media (min-width: 700px) {
        .grid-item, button {
        background-color:#DC143C;
        }

        .grid-item2, #caja-2 {
          display: none;
        }

        .grid-item{
        border-radius: 100px;
        font-size: 1.8rem;
        font-family: "Times New Roman", Times, serif;
        }
        .grid-container {
        background-color: #FFEBCD;
        }
    }

        /* TODO 4 (opcional, para quien termine antes): alinea el
        contenido de cada celda al centro verticalmente.
        Propiedad: align-items (va en .grid-container, no en .grid-item)
        Valor: center
        */
    
  </style>  
</head>
<body>
  <h1>Mi Primer Grid</h1>
  <p style="margin: 20px 0;">Grid con 3 columnas de 200px cada una — completa los TODO del CSS.</p>

  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
    <div class="grid-item">6</div>
    <div class="grid-item">7</div>
    <div class="grid-item">8</div>
    <div id="demo" class="grid-item">9</div>
  </div>

  
  <button id="boton">Click</button>
  <button id="boton2">Click 2</button>
  <button id="dark-model-btn">Modo Oscuro</button>

  <div id="caja-2">
    <div class="grid-item2">A</div>
    <div class="grid-item2">B</div>
    <div class="grid-item2">C</div>
  </div>

  <div id="caja-3">
    <div class="grid-item3">D</div>
    <div class="grid-item3">E</div>
    <div class="grid-item3">F</div>
  </div>

  <script>
    let txt = document.getElementById('demo');
    txt.textContent = 'Hola'
    let btnMsg = document.getElementById('boton')
    btnMsg.addEventListener('click', function () {
        txt.textContent = 'Bañate';
        txt.style.backgroundColor = "#6495ED";
    })

    let btnMsg2 = document.getElementById('boton2')
    btnMsg2.addEventListener('click', function () {
        txt.textContent = 'Hueles feo';
        txt.style.backgroundColor = "#8B4513";
    })

    let btnDarkMode = document.getElementById('dark-model-btn');

    btnDarkMode.addEventListener('click', function () {
        document.body.classList.toggle('dark-mode');
        if (document.body.classList.contains('dark-mode')) {
          btnDarkMode.textContent = 'Modo claro';
        } else { btnDarkMode.textContent = 'Modo oscuro';}
    })

    let caja3 = document.getElementById('caja-3');
    let mediaQuery700 = window.matchMedia('(min-width: 700px)');

    function toggleCaja3(e) {
        caja3.style.display = e.matches ? 'none' : 'grid';
    }

    toggleCaja3(mediaQuery700);
    mediaQuery700.addEventListener('change', toggleCaja3);
  </script>
</body>
</html>
